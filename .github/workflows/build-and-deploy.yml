# Build tokens, render the deck, build the docs site, and deploy to GitHub Pages.
name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: typst-community/setup-typst@v4
      - run: npm ci
      # 1. Verifier gate: WCAG AA contrast (every role x surface x stock),
      #    cross-surface parity (Typst + Mermaid literals), and the 8px grid.
      - run: npm run verify
      # 1b. Static design-rule lint (no stray hex, radius/shadow discipline, focus rings).
      - run: npm run lint:rules
      # 1c. Data-surface gates: chart palette (WCAG 1.4.11 + CVD/CIEDE2000) and the
      #     code theme (per-token AA per stock + greyscale cue).
      - run: npm run validate:viz
      - run: npm run validate:code
      # 2. Build design tokens (Style Dictionary -> dist/css, scss, js) and verify,
      #    plus the Figma Variables manifest (collections, stock modes, aliases).
      - run: npm run build:tokens
      - run: npm run build:figma
      # 3. Compile the Typst document examples to PDF (uses the vendored fonts).
      - run: npm run build:typst
      # 4. Build the static docs site (copies token CSS, components, fonts, the
      #    Mermaid theme, the deck diagram SVG, and the Typst PDFs into site/).
      - run: npm run build:site
      # 4b. Interaction + a11y gate: Playwright + axe-core against the built
      #     components page (tabs/accordion/dialog/menu keyboard, axe in 5 stocks,
      #     border-radius and target size). Serves site/ via the playwright config.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:components
      # 4b-ii. axe-core over the whole-page example templates (dashboard, landing)
      #        across stocks, proving the components compose into real pages.
      - run: npm run test:templates
      - run: npm run test:site
      # 4c. Visual regression. Runs inside the pinned Playwright image (matching
      #     the committed Linux baselines), so font rendering is identical.
      - run: docker run --rm -v "$PWD":/work -w /work --network host mcr.microsoft.com/playwright:v1.60.0-jammy npx playwright test visual.spec.mjs
      # 5. Render the Marp deck to HTML + PDF into the site. Fonts and the diagram
      #    SVG resolve from site/, which build:site populated.
      - run: npx @marp-team/marp-cli@latest packages/marp-theme/example-deck.md --theme packages/marp-theme/lokta.marp.css --html --allow-local-files -o site/deck.html
      - run: npx @marp-team/marp-cli@latest packages/marp-theme/example-deck.md --theme packages/marp-theme/lokta.marp.css --pdf --allow-local-files -o site/lokta-deck.pdf
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
